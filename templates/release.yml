name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 2.1.3
        required: true
        type: string
      release_mode:
        description: Choose how far to run the release process
        required: true
        default: Full
        type: choice
        options:
          - Commits Only
          - Commits and Release
          - Full

jobs:
  release:
    uses: kubiix/factorio-devops/.github/workflows/release-factorio-mod.yml@v1
    with:
      version: ${{ inputs.version }}
      release_mode: ${{ inputs.release_mode }}
    secrets:
      mod_portal_token: ${{ secrets.FACTORIO_MOD_PORTAL_TOKEN }}
