name: Initialize mod

on:
  workflow_dispatch:
    inputs:
      internal_name:
        description: Internal mod name (lowercase letters, digits, - and _)
        required: true
        type: string
      mod_title:
        description: Factorio title in info.json
        required: true
        type: string
      display_name:
        description: Mod Portal display name
        required: true
        type: string
      initial_version:
        description: Initial numeric version, for example 2.1.0
        required: true
        default: 2.1.0
        type: string
      license:
        description: License
        required: true
        default: MIT
        type: choice
        options: [MIT]
      category:
        description: Mod Portal category
        required: true
        default: utilities
        type: choice
        options: [no-category, content, overhaul, tweaks, utilities, scenarios, mod-packs, localizations, internal]
      tags:
        description: Optional comma-separated Mod Portal tags
        required: false
        type: string
      description:
        description: Mod Portal description (Markdown)
        required: true
        type: string
      faq:
        description: Optional Mod Portal FAQ (Markdown)
        required: false
        type: string
      summary:
        description: Optional Mod Portal summary (maximum 500 characters)
        required: false
        type: string

jobs:
  initialize:
    uses: kubiix/factorio-devops/.github/workflows/init-factorio-mod.yml@v1
    with:
      internal_name: ${{ inputs.internal_name }}
      mod_title: ${{ inputs.mod_title }}
      display_name: ${{ inputs.display_name }}
      initial_version: ${{ inputs.initial_version }}
      license: ${{ inputs.license }}
      category: ${{ inputs.category }}
      tags: ${{ inputs.tags }}
      description: ${{ inputs.description }}
      faq: ${{ inputs.faq }}
      summary: ${{ inputs.summary }}
