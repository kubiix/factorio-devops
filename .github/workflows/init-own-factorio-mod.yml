name: Initialize own Factorio mod

on:
  workflow_call:
    inputs:
      internal_name:
        required: true
        type: string
      mod_title:
        description: Title in Factorio's info.json
        required: true
        type: string
      category:
        required: true
        type: string
      tags:
        required: false
        default: ''
        type: string
      description:
        required: false
        default: ''
        type: string
      faq:
        required: false
        default: ''
        type: string
      summary:
        required: true
        type: string

secrets:
  gpg_private_key:
    required: true

permissions:
  contents: write

concurrency:
  group: factorio-mod-init-own-${{ github.repository }}
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out factorio-devops tools
        uses: actions/checkout@v4
        with:
          repository: kubiix/factorio-devops
          ref: main
          path: .factorio-devops

      - name: Import signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.gpg_private_key }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Configure commit author
        run: |
          git config user.name "KubiiTron [bot]"
          git config user.email "kubiix@live.com"

      - name: Validate and initialize the repository
        env:
          INTERNAL_NAME: ${{ inputs.internal_name }}
          MOD_TITLE: ${{ inputs.mod_title }}
          CATEGORY: ${{ inputs.category }}
          TAGS: ${{ inputs.tags }}
          DESCRIPTION: ${{ inputs.description }}
          FAQ: ${{ inputs.faq }}
          SUMMARY: ${{ inputs.summary }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python3 .factorio-devops/scripts/factorio_mod_init_own.py .

      - name: Commit initialization
        run: |
          git add .factorio-release.json src modPortalContent COPYRIGHT
          git commit -m "Start development 0.1.x"
          git tag --annotate Init --message "Initialize mod"
          git push origin HEAD --follow-tags
