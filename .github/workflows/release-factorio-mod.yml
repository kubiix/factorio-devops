name: Release Factorio mod

on:
  workflow_call:
    inputs:
      version:
        description: Release version (three numeric components, for example 2.1.3)
        required: true
        type: string
      branch:
        description: Branch that receives the release and follow-up commits
        required: false
        default: main
        type: string
      release_mode:
        description: Commits Only, Commits and Release, or Full
        required: false
        default: Full
        type: string
    secrets:
      gpg_private_key:
        required: true
      mod_portal_token:
        required: false

permissions:
  contents: write

concurrency:
  group: factorio-mod-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the mod repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # A reusable workflow does not automatically expose its repository files.
      # This checkout makes the shared implementation available to the caller.
      - name: Check out factorio-devops tools
        uses: actions/checkout@v4
        with:
          repository: kubiix/factorio-devops
          ref: main
          path: .factorio-devops

      - name: Import signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.gpg_private_key }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Configure commit author
        run: |
          git config user.name "kubiix"
          git config user.email "kubiix@live.com"

      - name: Validate release mode
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          case "$RELEASE_MODE" in
            "Commits Only"|"Commits and Release"|"Full") ;;
            *) echo "Invalid release mode: $RELEASE_MODE" >&2; exit 1 ;;
          esac

      - name: Finalize the release files
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .factorio-devops/scripts/factorio_mod_release.py prepare . "$RELEASE_VERSION"

      - name: Commit and tag the release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          git add src/info.json src/changelog.txt .factorio-release.json
          git commit -S -m "Release $RELEASE_VERSION"
          git tag -s --annotate "v$RELEASE_VERSION" --message "Release $RELEASE_VERSION"
          git push origin "HEAD:$RELEASE_BRANCH" --follow-tags

      - name: Build and validate the mod archive
        if: inputs.release_mode != 'Commits Only'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .factorio-devops/scripts/factorio_mod_release.py build . "$RELEASE_VERSION"

      - name: Create a draft GitHub release
        if: inputs.release_mode != 'Commits Only'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" "dist/"*.zip \
            --draft --title "$(jq -r .title src/info.json) $RELEASE_VERSION" \
            --notes-file .release-notes.md

      - name: Upload to the Factorio Mod Portal
        if: inputs.release_mode == 'Full'
        env:
          MOD_PORTAL_TOKEN: ${{ secrets.mod_portal_token }}
        run: python3 .factorio-devops/scripts/factorio_mod_release.py upload .

      - name: Publish the GitHub release
        if: inputs.release_mode != 'Commits Only'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false

      - name: Start the next development cycle
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          python3 .factorio-devops/scripts/factorio_mod_release.py start-development .
          NEXT_VERSION="$(jq -r '.version' src/info.json)"
          git add src/info.json src/changelog.txt .factorio-release.json
          git commit -S -m "Start development $NEXT_VERSION"
          git push origin "HEAD:$RELEASE_BRANCH"
